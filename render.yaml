services:
  - type: web
    name: sinulead-api
    runtime: python
    region: singapore
    rootDir: server
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sinulead-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "1440"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: sinuleadph@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        value: sinuleadph@gmail.com

databases:
  - name: sinulead-db
    region: singapore
    plan: free
    databaseName: sinulead
    user: sinulead